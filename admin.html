<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrador de productos</title>
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilos.css" />

    <!-- Conexión con la nube -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/datos.js"></script>
    <!-- comunes.js va aquí porque define escaparHTML, que usa el
         script del final de la página. -->
    <script src="js/comunes.js"></script>

    <!-- Candado: si no hay sesión iniciada, manda al login antes de
         que se llegue a dibujar nada de la página. -->
    <script>
      protegerPaginaNube();
    </script>
  </head>
  <body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center mb-2">
      <span id="estadoNube" class="text-sm text-gray-500"></span>
      <button
        onclick="salir()"
        class="text-sm text-gray-600 hover:text-red-600 hover:underline"
      >
        🔓 Cerrar sesión
      </button>
    </div>

    <h1 class="text-3xl font-bold text-center mb-6 text-pink-600">
      🎯 Administrador de productos 🎯
    </h1>

    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow space-y-4">
      <p
        id="avisoEdicion"
        hidden
        class="bg-yellow-100 border border-yellow-400 text-yellow-800 p-3 rounded text-sm"
      >
        ✏️ Estás <strong>editando</strong> un producto. Si no eliges una foto
        nueva, se conserva la que ya tenía.
      </p>

      <input type="hidden" id="editIndex" value="-1" />

      <label for="categoria" class="block text-sm font-medium text-gray-700">
        Categoría
      </label>
      <select id="categoria" class="w-full p-2 border rounded">
        <option value="productos">Piñatas</option>
        <option value="productos-globos">Globos</option>
        <option value="productos-velas">Velas</option>
        <option value="productos-peluches">Peluches</option>
        <option value="productos-cortinas">Cortinas</option>
        <option value="productos-platos">Platos</option>
        <option value="productos-vasos">Vasos</option>
      </select>

      <input
        type="text"
        id="nombre"
        placeholder="Nombre del producto"
        class="w-full p-2 border rounded"
        required
      />
      <input
        type="number"
        id="precio"
        placeholder="Precio"
        min="0"
        step="1"
        class="w-full p-2 border rounded"
        required
      />
      <input
        type="file"
        id="imagen"
        accept="image/*"
        class="w-full p-2 border rounded"
      />
      <p class="text-xs text-gray-500">
        La foto se encoge sola antes de subirse, así la página carga rápido.
      </p>

      <div class="flex gap-3">
        <button
          id="btnGuardar"
          class="flex-1 bg-green-500 text-white py-2 rounded hover:bg-green-600 disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          Guardar producto
        </button>
        <button
          id="btnCancelar"
          class="px-4 py-2 rounded border border-gray-300 text-gray-600 hover:bg-gray-100"
        >
          Limpiar
        </button>
      </div>
    </div>

    <div class="max-w-4xl mx-auto mt-10 bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-bold mb-4">📦 Productos guardados</h2>
      <div id="lista-productos" class="grid md:grid-cols-3 gap-4"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let productosActuales = [];

      /* Avisa de dónde se están guardando los productos, para que no
         haya dudas sobre si los clientes los ven o no. */
      $("estadoNube").innerHTML = NUBE_CONFIGURADA
        ? '☁️ Conectado: tus clientes ven estos productos'
        : '⚠️ Sin conectar: estos productos <strong>solo los ves tú</strong>. Mira CONFIGURAR-SUPABASE.md';

      async function guardarDesdeFormulario() {
        const nombre = $("nombre").value.trim();
        const precio = parseFloat($("precio").value);
        const archivo = $("imagen").files[0];
        const editRef = $("editIndex").value;
        const editando = editRef !== "-1" && editRef !== "";
        const categoria = $("categoria").value;
        const boton = $("btnGuardar");

        if (!nombre || isNaN(precio) || (!editando && !archivo)) {
          alert("Por favor, completa todos los campos.");
          return;
        }
        if (precio < 0) {
          alert("El precio no puede ser negativo.");
          return;
        }

        /* Bloquear el botón evita que un doble clic guarde el producto
           dos veces mientras se sube la foto. */
        boton.disabled = true;
        boton.textContent = archivo ? "Subiendo foto…" : "Guardando…";

        try {
          await guardarProducto({
            id: editando ? editRef : null,
            categoria,
            nombre,
            precio,
            archivo,
          });
          limpiarFormulario();
          await mostrarProductos();
          alert(editando ? "✅ Producto editado." : "✅ Producto guardado.");
        } catch (e) {
          alert("⚠️ " + e.message);
        } finally {
          boton.disabled = false;
          boton.textContent = "Guardar producto";
        }
      }

      async function mostrarProductos() {
        const categoria = $("categoria").value;
        const contenedor = $("lista-productos");
        contenedor.innerHTML =
          '<p class="col-span-full text-center text-gray-500 py-4">Cargando…</p>';

        try {
          productosActuales = await listarProductos(categoria);
        } catch (e) {
          contenedor.innerHTML =
            '<p class="col-span-full text-center text-red-600 py-4">Error: ' +
            escaparHTML(e.message) +
            "</p>";
          return;
        }

        contenedor.innerHTML = "";

        if (productosActuales.length === 0) {
          contenedor.innerHTML =
            '<p class="col-span-full text-center text-gray-500 py-4">Todavía no hay productos en esta categoría.</p>';
          return;
        }

        productosActuales.forEach((p, index) => {
          /* Sin nube el identificador es la posición en la lista;
             con nube es el id de la base de datos. */
          const ref = p.id !== undefined ? p.id : index;

          const div = document.createElement("div");
          div.className = "border p-4 rounded-lg shadow text-center";
          div.innerHTML = `
            <img src="${p.imagen}" alt="${escaparHTML(p.nombre)}" loading="lazy"
                 class="w-full h-64 object-cover rounded-lg mb-4 transition-transform duration-300 hover:scale-105 hover:shadow-2xl" />
            <h3 class="font-bold text-xl">${escaparHTML(p.nombre)}</h3>
            <p class="text-pink-600">$${escaparHTML(String(p.precio))}</p>
            <div class="flex justify-center gap-4 mt-3">
              <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded js-editar">✏️ Editar</button>
              <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded js-borrar">🗑️ Eliminar</button>
            </div>`;

          /* Listeners en vez de onclick: un nombre con apóstrofo
             ya no rompe nada. */
          div
            .querySelector(".js-editar")
            .addEventListener("click", () => editarProducto(index, ref));
          div
            .querySelector(".js-borrar")
            .addEventListener("click", () => eliminarProducto(ref, p.nombre));

          contenedor.appendChild(div);
        });
      }

      async function eliminarProducto(ref, nombre) {
        if (!confirm(`¿Eliminar "${nombre}"?`)) return;
        try {
          await borrarProducto(ref, $("categoria").value);
          await mostrarProductos();
        } catch (e) {
          alert("⚠️ " + e.message);
        }
      }

      function editarProducto(index, ref) {
        const producto = productosActuales[index];
        $("nombre").value = producto.nombre;
        $("precio").value = producto.precio;
        $("editIndex").value = ref;
        $("imagen").value = "";
        $("avisoEdicion").hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function limpiarFormulario() {
        $("nombre").value = "";
        $("precio").value = "";
        $("imagen").value = "";
        $("editIndex").value = -1;
        $("avisoEdicion").hidden = true;
      }

      $("btnGuardar").addEventListener("click", guardarDesdeFormulario);
      $("btnCancelar").addEventListener("click", limpiarFormulario);
      $("categoria").addEventListener("change", () => {
        limpiarFormulario();
        mostrarProductos();
      });

      mostrarProductos(); // Mostrar al cargar
    </script>

    <div class="text-center mt-6 mb-10">
      <a href="principal.html" class="btn-volver">
        <span class="flecha flecha-izq">⬅</span>
        Volver a la tienda
        <span class="flecha flecha-izq">⬅</span>
      </a>
    </div>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Platos de fiesta">
  <!-- Plato de fiesta visto desde arriba. El aro de adornos gira despacio. -->
  <style>
    .adornos { transform-origin: 50px 52px; animation: girar 9s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
  <!-- Cubiertos detras del plato -->
  <path d="M14 24 v52" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <path d="M11 20 v12 M14 19 v13 M17 20 v12" stroke="#94a3b8" stroke-width="2.6" stroke-linecap="round" />
  <path d="M86 24 v52" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <path d="M86 19 q7 6 0 16 q-7 -10 0 -16 z" fill="#94a3b8" />
  <!-- Plato -->
  <circle cx="50" cy="52" r="38" fill="#ffffff" stroke="#f472b6" stroke-width="4" />
  <circle cx="50" cy="52" r="30" fill="#ffe4ef" />
  <circle cx="50" cy="52" r="18" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" />
  <!-- Adornos del borde -->
  <g class="adornos">
    <circle cx="50" cy="28" r="3.4" fill="#f472b6" />
    <circle cx="67" cy="35" r="3.4" fill="#fbbf24" />
    <circle cx="74" cy="52" r="3.4" fill="#34d399" />
    <circle cx="67" cy="69" r="3.4" fill="#60a5fa" />
    <circle cx="50" cy="76" r="3.4" fill="#f472b6" />
    <circle cx="33" cy="69" r="3.4" fill="#fbbf24" />
    <circle cx="26" cy="52" r="3.4" fill="#34d399" />
    <circle cx="33" cy="35" r="3.4" fill="#60a5fa" />
  </g>
</svg>

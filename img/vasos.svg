<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Vaso de fiesta">
  <!-- Vaso de fiesta con popote. Las burbujas suben solas. -->
  <style>
    .burbuja { animation: subir 2.6s ease-in-out infinite; }
    .b2 { animation-delay: 0.9s; }
    .b3 { animation-delay: 1.7s; }
    @keyframes subir {
      0%   { transform: translateY(0); opacity: 0; }
      25%  { opacity: 0.9; }
      100% { transform: translateY(-30px); opacity: 0; }
    }
    .vaso { transform-origin: 50px 88px; animation: brindis 3s ease-in-out infinite; }
    @keyframes brindis { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  </style>
  <g class="vaso">
    <!-- Popote -->
    <path d="M58 32 L70 8" stroke="#22c55e" stroke-width="6" stroke-linecap="round" />
    <path d="M70 8 h10" stroke="#22c55e" stroke-width="6" stroke-linecap="round" />
    <!-- Refresco dentro del vaso -->
    <path d="M32 40 h36 l-4 44 h-28 z" fill="#fb7185" />
    <!-- Vaso -->
    <path d="M28 28 h44 l-6 60 h-32 z" fill="#f472b6" opacity="0.55" />
    <path d="M28 28 h44 l-6 60 h-32 z" fill="none" stroke="#db2777" stroke-width="3" stroke-linejoin="round" />
    <path d="M30 44 h40" stroke="#ffffff" stroke-width="4" opacity="0.7" />
    <ellipse cx="50" cy="28" rx="22" ry="6" fill="#f9a8d4" stroke="#db2777" stroke-width="3" />
    <!-- Burbujas -->
    <circle class="burbuja" cx="42" cy="72" r="3" fill="#ffffff" opacity="0" />
    <circle class="burbuja b2" cx="52" cy="76" r="2.2" fill="#ffffff" opacity="0" />
    <circle class="burbuja b3" cx="58" cy="70" r="2.6" fill="#ffffff" opacity="0" />
  </g>
</svg>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso Super Usuario | Piñatería Papelito Crepé</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- La misma letra y los mismos adornos que la tienda. Antes esta
         página llevaba sus propios estilos sueltos dentro del <head>. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="acceso-fondo">
    <!-- Confeti cayendo, detrás de todo -->
    <span class="panel-confeti" style="left: 8%; animation-delay: 0s" aria-hidden="true">🎊</span>
    <span class="panel-confeti" style="left: 27%; animation-delay: 3.2s" aria-hidden="true">🎈</span>
    <span class="panel-confeti" style="left: 62%; animation-delay: 1.7s" aria-hidden="true">✨</span>
    <span class="panel-confeti" style="left: 84%; animation-delay: 5.4s" aria-hidden="true">🎉</span>

    <main class="acceso">
      <span class="acceso-candado" aria-hidden="true">🔐</span>
      <h1 class="acceso-titulo">Acceso Super Usuario</h1>
      <p class="acceso-marca">🎈 Piñatería Papelito Crepé 🎈</p>

      <!-- Un <form> de verdad: así funciona la tecla Enter -->
      <form id="formLogin">
        <label for="usuario" hidden>Usuario</label>
        <div class="panel-campo">
          <input
            type="text"
            id="usuario"
            class="panel-entrada"
            placeholder="Usuario"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          />
        </div>
        <p id="pista" class="acceso-pista"></p>

        <label for="clave" hidden>Contraseña</label>
        <div class="panel-campo">
          <input
            type="password"
            id="clave"
            class="panel-entrada"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" id="btnEntrar" class="acceso-boton">
          Entrar
        </button>
      </form>

      <p id="mensaje" role="alert" class="acceso-mensaje"></p>
      <a href="principal.html" class="acceso-volver">⬅ Volver a la tienda</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/datos.js"></script>
    <script>
      const form = document.getElementById("formLogin");
      const campoUsuario = document.getElementById("usuario");
      const campoClave = document.getElementById("clave");
      const boton = document.getElementById("btnEntrar");
      const mensaje = document.getElementById("mensaje");

      /* Con Supabase el usuario es un CORREO; sin configurar, sigue
         siendo el usuario de siempre. Se ajustan el campo y la pista. */
      if (NUBE_CONFIGURADA) {
        campoUsuario.type = "email";
        campoUsuario.placeholder = "Correo electrónico";
        document.getElementById("pista").textContent =
          "Entra con el correo que diste de alta en Supabase";
      }

      /* Si ya hay sesión abierta, entrar directo */
      haySesion().then((hay) => {
        if (hay) window.location.replace("admin.html");
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        mensaje.textContent = "";
        boton.disabled = true;
        boton.textContent = "Entrando…";

        try {
          if (await entrar(campoUsuario.value.trim(), campoClave.value)) {
            /* El candado antiguo necesita marcar la sesión a mano.
               Con Supabase la sesión la lleva la propia librería. */
            if (!NUBE_CONFIGURADA) iniciarSesion();
            window.location.replace("admin.html");
          } else {
            /* Mensaje genérico a propósito: no revelamos cuál de los
               dos está mal, para no ayudar a quien esté probando. */
            mensaje.textContent = "⚠️ Usuario o contraseña incorrectos.";
            campoClave.value = "";
            campoClave.focus();
          }
        } catch (error) {
          mensaje.textContent = "⚠️ " + error.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Entrar";
        }
      });
    </script>
  </body>
</html>

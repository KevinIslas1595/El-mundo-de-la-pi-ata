<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso Super Usuario | El Mundo de la Piñata</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #ffe4e1;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
      }
      .login {
        background: white;
        padding: 24px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 100%;
        max-width: 340px;
      }
      input {
        padding: 10px;
        margin: 10px 0;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      button {
        padding: 10px;
        background: #ff3366;
        color: white;
        border: none;
        width: 100%;
        cursor: pointer;
        border-radius: 5px;
        font-size: 1rem;
      }
      button:hover {
        background: #e62e5c;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .pista {
        margin: -4px 0 0;
        font-size: 0.78rem;
        color: #777;
        text-align: left;
      }
      .volver {
        display: inline-block;
        margin-top: 16px;
        color: #666;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="login">
      <h2>🔒 Acceso Super Usuario</h2>

      <!-- Un <form> de verdad: así funciona la tecla Enter -->
      <form id="formLogin">
        <label for="usuario" hidden>Usuario</label>
        <input
          type="text"
          id="usuario"
          placeholder="Usuario"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        />
        <p id="pista" class="pista"></p>

        <label for="clave" hidden>Contraseña</label>
        <input
          type="password"
          id="clave"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
        />
        <button type="submit" id="btnEntrar">Entrar</button>
      </form>

      <p id="mensaje" role="alert" style="color: red; white-space: pre-line"></p>
      <a href="principal.html" class="volver">⬅ Volver a la tienda</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/datos.js"></script>
    <script>
      const form = document.getElementById("formLogin");
      const campoUsuario = document.getElementById("usuario");
      const campoClave = document.getElementById("clave");
      const boton = document.getElementById("btnEntrar");
      const mensaje = document.getElementById("mensaje");

      /* Con Supabase el usuario es un CORREO; sin configurar, sigue
         siendo el usuario de siempre. Se ajustan el campo y la pista. */
      if (NUBE_CONFIGURADA) {
        campoUsuario.type = "email";
        campoUsuario.placeholder = "Correo electrónico";
        document.getElementById("pista").textContent =
          "Entra con el correo que diste de alta en Supabase";
      }

      /* Si ya hay sesión abierta, entrar directo */
      haySesion().then((hay) => {
        if (hay) window.location.replace("admin.html");
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        mensaje.textContent = "";
        boton.disabled = true;
        boton.textContent = "Entrando…";

        try {
          if (await entrar(campoUsuario.value.trim(), campoClave.value)) {
            /* El candado antiguo necesita marcar la sesión a mano.
               Con Supabase la sesión la lleva la propia librería. */
            if (!NUBE_CONFIGURADA) iniciarSesion();
            window.location.replace("admin.html");
          } else {
            /* Mensaje genérico a propósito: no revelamos cuál de los
               dos está mal, para no ayudar a quien esté probando. */
            mensaje.textContent = "⚠️ Usuario o contraseña incorrectos.";
            campoClave.value = "";
            campoClave.focus();
          }
        } catch (error) {
          mensaje.textContent = "⚠️ " + error.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Entrar";
        }
      });
    </script>
  </body>
</html>
